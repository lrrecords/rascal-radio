<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rascal Radio embed test</title></head>
<body style="font-family:sans-serif;background:#fff;color:#111;padding:16px;max-width:640px">
  <h1>Plain page embedding Rascal Radio</h1>
  <p>Serve this from a different port than the app, e.g. <code>python3 -m http.server 8790 -d test</code>,
     then open http://127.0.0.1:8790/embed-test.html while <code>npm run dev</code> is running.</p>
  <h2>Compact (152px)</h2>
  <iframe src="http://127.0.0.1:8788/embed/test?size=compact" width="100%" height="152" style="border:0;border-radius:12px;max-width:100%" loading="lazy" allow="autoplay; encrypted-media; clipboard-write" title="Rascal Radio: Test show"></iframe>
  <h2>Full</h2>
  <iframe src="http://127.0.0.1:8788/embed/test?size=full" width="100%" height="480" style="border:0;border-radius:12px;max-width:100%" loading="lazy" allow="autoplay; encrypted-media; clipboard-write" title="Rascal Radio: Test show"></iframe>
</body>
</html>
