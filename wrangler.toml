# Access application's Overview tab. Neither is a secret.
ACCESS_TEAM_DOMAIN = "calm-pond-4784.cloudflareaccess.com"
ACCESS_AUD = "d793506c14fa074ab4c0357c8e5c45e45a181ea6cdc27f500d67f6f816b8375f"
